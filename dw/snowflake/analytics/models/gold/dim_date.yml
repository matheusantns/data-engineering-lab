version: 2

models:
  - name: dim_date
    description: Datas UTC observadas nos pedidos, com atributos de calendário ISO.
    columns:
      - name: date_key
        description: Chave inteira da data no formato YYYYMMDD.
        data_tests:
          - not_null
          - unique

      - name: full_date
        description: Data UTC do pedido.
        data_tests:
          - not_null

      - name: day_of_month
        description: Dia do mês.

      - name: day_of_week
        description: Dia ISO da semana, de segunda-feira igual a 1 até domingo igual a 7.

      - name: week_of_year
        description: Semana ISO do ano.

      - name: month_number
        description: Número do mês.

      - name: month_name
        description: Nome completo do mês em inglês.

      - name: quarter_number
        description: Número do trimestre.

      - name: year_number
        description: Ano civil.

unit_tests:
  - name: dim_date_derives_utc_calendar_attributes
    description: Deriva atributos civis e ISO para cada data UTC distinta observada.
    model: dim_date
    given:
      - input: ref('stg_orders')
        rows:
          - {ordered_at_utc: '2021-01-01 01:30:00'}
          - {ordered_at_utc: '2026-09-08 10:00:00'}
          - {ordered_at_utc: '2026-09-08 22:00:00'}
    expect:
      rows:
        - {date_key: 20210101, full_date: '2021-01-01', day_of_month: 1, day_of_week: 5, week_of_year: 53, month_number: 1, month_name: January, quarter_number: 1, year_number: 2021}
        - {date_key: 20260908, full_date: '2026-09-08', day_of_month: 8, day_of_week: 2, week_of_year: 37, month_number: 9, month_name: September, quarter_number: 3, year_number: 2026}

  - name: dim_date_is_empty_without_orders
    description: Não fabrica datas quando a entrada não contém pedidos.
    model: dim_date
    given:
      - input: ref('stg_orders')
        rows: []
    expect:
      rows: []
