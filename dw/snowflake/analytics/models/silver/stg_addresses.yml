version: 2

models:
  - name: stg_addresses
    description: Endereços operacionais normalizados para consumo analítico.
    columns:
      - name: address_id
        description: Identificador do endereço.
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: Identificador do usuário proprietário do endereço.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: label
        description: Rótulo do endereço.

      - name: line1
        description: Primeira linha do endereço.

      - name: line2
        description: Segunda linha do endereço, quando informada.

      - name: city
        description: Cidade.

      - name: region
        description: Região ou estado, quando informado.

      - name: postal_code
        description: Código postal, quando informado.

      - name: country_code
        description: Código de país preservado da origem.

      - name: is_default_shipping
        description: Indica se é o endereço padrão de entrega.

      - name: is_default_billing
        description: Indica se é o endereço padrão de cobrança.

      - name: created_at_utc
        description: Data e hora de criação normalizada para UTC.

      - name: updated_at_utc
        description: Data e hora da última atualização normalizada para UTC.
