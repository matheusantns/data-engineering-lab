version: 2

models:
  - name: stg_product_variants
    description: Variantes comercializáveis normalizadas para consumo analítico.
    columns:
      - name: variant_id
        description: Identificador da variante.
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: Identificador do produto da variante.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: sku
        description: Código comercial da variante.
        data_tests:
          - not_null
          - unique

      - name: name
        description: Nome da variante.

      - name: price
        description: Preço de catálogo não negativo.

      - name: currency
        description: Código de moeda preservado da origem.

      - name: attributes
        description: Atributos semiestruturados preservados da origem.

      - name: is_active
        description: Indica se a variante está ativa.

      - name: created_at_utc
        description: Data e hora de criação normalizada para UTC.

      - name: updated_at_utc
        description: Data e hora da última atualização normalizada para UTC.
