version: 2

models:
  - name: stg_carts
    description: Carrinhos operacionais de usuários e visitantes normalizados para consumo analítico.
    columns:
      - name: cart_id
        description: Identificador do carrinho.
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: Identificador opcional do usuário; ausente em carrinhos de visitantes.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: session_token
        description: Token único da sessão associada ao carrinho.
        data_tests:
          - not_null
          - unique

      - name: status
        description: Estado atual do carrinho.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - active
                  - converted
                  - abandoned

      - name: created_at_utc
        description: Data e hora de criação normalizada para UTC.

      - name: updated_at_utc
        description: Data e hora da última atualização normalizada para UTC.
