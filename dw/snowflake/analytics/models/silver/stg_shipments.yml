version: 2

models:
  - name: stg_shipments
    description: Entregas operacionais ligadas a pedidos e transportadoras.
    columns:
      - name: shipment_id
        description: Identificador da entrega.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Identificador do pedido entregue.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: carrier_id
        description: Identificador da transportadora.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_carriers')
                field: carrier_id

      - name: tracking_number
        description: Código opcional de rastreamento.

      - name: shipped_at_utc
        description: Data e hora opcional do envio normalizada para UTC.

      - name: delivered_at_utc
        description: Data e hora opcional da entrega normalizada para UTC.

      - name: created_at_utc
        description: Data e hora de criação normalizada para UTC.
