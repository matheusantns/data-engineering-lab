# Sample Postgres (ecommerce) for ETL / SQL labs.
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v && docker compose up -d
#
# Connect: localhost:5433 / ecommerce / ecommerce / ecommerce

services:
  sample-postgres:
    image: postgres:16-alpine
    container_name: sample-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - sample_postgres_data:/var/lib/postgresql/data
    networks:
      - data-lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  data-lab:
    name: data-lab

volumes:
  sample_postgres_data:
